[package]
name = "nova-crosshair"
version = "0.2.0"
description = "A lightweight, transparent desktop crosshair overlay"
authors = ["NOVA contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "nova_crosshair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.18"
gdk = "0.18"
gdk-sys = "0.18"
gdkx11 = "0.18"
glib = "0.18"
glib-sys = "0.18"
gtk = "0.18"
gtk-sys = "0.18"
x11 = { version = "2.21", features = ["xlib"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
